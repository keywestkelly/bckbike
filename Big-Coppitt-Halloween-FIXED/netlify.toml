[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/stops"
  to = "/.netlify/functions/stops"
  status = 200
[[redirects]]
  from = "/api/submit"
  to = "/.netlify/functions/submit"
  status = 200
[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
